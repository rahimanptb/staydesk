packages:
  - apps/*
  - packages/*

# pnpm blocks dependency lifecycle scripts by default; only these may run them.
allowBuilds:
  prisma: true
  '@prisma/engines': true
  esbuild: true
  sharp: true
  # Testcontainers' Docker client: optional native speedups / version checks, not needed.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # BullMQ's msgpack: optional native decoder; the pure-JS fallback is used.
  msgpackr-extract: false
